server:
  port: 8080

spring:
  application:
    name: library-management-system

  datasource:
    url: jdbc:postgresql://localhost:5432/library_db2
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: idid@123

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  h2:
    console:
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET:ChangeThisSuperSecretKeyForJwtSigningInProduction123456}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION:3600000}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}
    issuer: library-management-system

  admin:
    default-username: ${ADMIN_USERNAME:admin}
    default-email: ${ADMIN_EMAIL:admin@library.local}
    default-password: ${ADMIN_PASSWORD:Admin@123}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html