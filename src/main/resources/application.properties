
# SERVER
server.port=8080

# APPLICATION
spring.application.name=library-management-system

# POSTGRESQL DATABASE
spring.datasource.url=jdbc:postgresql://localhost:5432/######
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=#######

  # JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

  # EMAIL - GMAIL SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=###############
spring.mail.password=${MAIL_PASSWORD:##########}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

  # JWT
app.jwt.secret=${JWT_SECRET:############################}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION:3600000}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION:604800000}
app.jwt.issuer=library-management-system

  # DEFAULT ADMIN
app.admin.default-username=${ADMIN_USERNAME:admin}
app.admin.default-email=${ADMIN_EMAIL:admin@library.local}
app.admin.default-password=${ADMIN_PASSWORD:#####}

# CLOUDINARY (image storage)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:hau2cxxs}
cloudinary.api-key=${CLOUDINARY_API_KEY:###########}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:############}

# Max upload size for profile/book images
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# SPRINGDOC / SWAGGER
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html